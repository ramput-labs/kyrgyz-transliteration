[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyrgyz-transliteration"
version = "0.3.0"
description = "Транслитерация кыргызского языка: кириллица <-> английская ASCII-латиница"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["kyrgyz", "kirghiz", "transliteration", "romanization", "cyrillic", "latin", "english", "slugify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ramput-labs/kyrgyz-transliteration"
Source = "https://github.com/ramput-labs/kyrgyz-transliteration"
Issues = "https://github.com/ramput-labs/kyrgyz-transliteration/issues"
Changelog = "https://github.com/ramput-labs/kyrgyz-transliteration/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kyrgyz-transliteration = "kyrgyz_transliteration.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kyrgyz_transliteration"]
# Списки слов попадают в wheel сжатыми (*.txt.gz) — см. hatch_build.py.
exclude = ["src/kyrgyz_transliteration/data/*.txt"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/hatch_build.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
